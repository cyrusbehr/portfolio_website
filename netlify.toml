# Plain static site: nothing to build. Setting the command here overrides the old Gatsby
# build configured in the Netlify UI.
[build]
  publish = "site"
  command = "echo 'Static site, no build step'"

# The site was a Gatsby build until 2026, so the dashboard may still attach the Gatsby runtime plugin.
[build.environment]
  NETLIFY_SKIP_GATSBY_BUILD_PLUGIN = "true"

# The old site linked a resume PDF from here; send those visitors to the experience section.
[[redirects]]
  from = "/cyrus_behroozi_resume.pdf"
  to = "/#record"
  status = 302

# The retired service worker must never be cached, so returning browsers pick up the version that removes it.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Asset files carry a version in their names (.v1), so they can be cached for a year.
# Bump the version in the file name and its reference whenever one of them changes.
[[headers]]
  for = "/assets/data/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og.v1.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
